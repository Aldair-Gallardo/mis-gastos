<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis Gastos</title>
  <meta name="description" content="Controla tus gastos e ingresos, con respaldo en Excel.">

  <!-- Instalación (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F3F4F8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mis Gastos">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">

  <!-- Tema antes de pintar, para evitar un destello blanco en modo noche -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('mg-theme') || 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app">

    <!-- Menú lateral (tablet / computadora) -->
    <nav class="sidebar" aria-label="Navegación principal">
      <div class="sidebar__brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 19v-6M12 19V6M17 19v-8"/></svg>
        </span>
        Mis Gastos
      </div>
      <a class="sidebar__link" href="#/inicio" data-route="inicio">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        Inicio
      </a>
      <a class="sidebar__link" href="#/estadisticas" data-route="estadisticas">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
        Estadísticas
      </a>
      <a class="sidebar__link" href="#/historial" data-route="historial">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        Historial
      </a>
      <a class="sidebar__link" href="#/respaldo" data-route="respaldo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h8M12 11v8"/></svg>
        Respaldo y ajustes
      </a>
      <div class="sidebar__spacer"></div>
      <button type="button" class="btn btn--primary btn--block" data-shell="add">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Agregar movimiento
      </button>
    </nav>

    <!-- Aquí el router dibuja cada pantalla -->
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <!-- Barra inferior (celular) -->
  <nav class="tabbar" aria-label="Navegación principal">
    <a class="tabbar__link" href="#/inicio" data-route="inicio">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      Inicio
    </a>
    <a class="tabbar__link" href="#/estadisticas" data-route="estadisticas">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
      Estadísticas
    </a>
    <button type="button" class="tabbar__fab" data-shell="add" aria-label="Agregar movimiento">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a class="tabbar__link" href="#/historial" data-route="historial">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      Historial
    </a>
    <a class="tabbar__link" href="#/respaldo" data-route="respaldo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h8M12 11v8"/></svg>
      Respaldo
    </a>
  </nav>

  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px">Esta app necesita JavaScript activado.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
